<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Site</title>
  <style>
    :root {
      --bg-light: #ffffff;
      --bg-dark: #fdfdfd;
      --fg-light: #0e0e0e;
      --fg-dark: #0c0c0c;
      --primary: #007aff;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(to top right, var(--bg-light), #4302f4);
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
    }

    body.dark-mode {
      background: linear-gradient(to top right, var(--bg-dark), #0f0f83);
      color: var(--fg-dark);
    }

    .container {
      background: linear-gradient(to top right, #ffffff, #0088ff);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      padding: 30px;
      width: 360px;
      margin: 40px auto;
      text-align: center;
      color: var(--fg-light);
      position: relative;
      transition: background 0.3s, color 0.3s;
    }

    body.dark-mode .container {
      background: linear-gradient(to top right, #734949, #47148f);
      color: var(--fg-dark);
    }

    input, button, select {
      padding: 10px 14px;
      width: 90%;
      margin: 10px 0;
      border: 1px solid #020202;
      border-radius: 12px;
      outline: none;
      font-size: 1rem;
    }

    button {
      background-color: var(--primary);
      color: rgb(246, 246, 246);
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #4e286f;
    }

    .weather-box, .forecast {
      margin-top: 20px;
      animation: fadeIn 0.7s ease;
    }

    .forecast {
      background: rgba(11, 11, 11, 0.4);
      padding: 10px;
      border-radius: 12px;
    }

    body.dark-mode .forecast {
      background: rgba(4, 4, 4, 0.4);
    }

    .forecast-day {
      padding: 6px 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #suggestions {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
      background: rgb(255, 255, 255);
      border-radius: 10px;
      max-height: 120px;
      overflow-y: auto;
      position: absolute;
      top: 110px;
      left: 30px;
      width: 300px;
      display: none;
      box-shadow: 0 4px 12px rgba(139, 137, 137, 0.1);
      z-index: 10;
    }

    #suggestions li {
      padding: 8px 12px;
      cursor: pointer;
    }

    #suggestions li:hover {
      background-color: #7cdff6;
    }

    /* Accessibility improvement */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>☁️ Weather Site</h1>
    <label for="cityInput" class="sr-only">City Name</label>
    <select id="unitToggle" aria-label="Select temperature unit">
      <option value="metric">Celsius (°C)</option>
      <option value="imperial">Fahrenheit (°F)</option>
    </select>
    <button onclick="toggleDarkMode()" aria-label="Toggle dark mode">🌓 Toggle Dark Mode</button>
    <input type="text" id="cityInput" placeholder="Enter city name" autocomplete="off" aria-label="Enter city name" />
    <ul id="suggestions" role="listbox" aria-label="City suggestions"></ul>
    <button id="getWeatherBtn">Get Weather</button>
    <button id="useLocationBtn" aria-label="Use my location for weather">📍 Use My Location</button>
    <div id="weatherResult" class="weather-box" role="region" aria-live="polite" aria-label="Current weather information"></div>
    <div id="forecastResult" class="forecast" role="region" aria-live="polite" aria-label="5-day weather forecast"></div>
  </main>

  <script>
    const apiKey = 'fe451934ea2036046dba4d4487880768';
    const unitToggle = document.getElementById("unitToggle");
    let unit = unitToggle.value;

    const cityInput = document.getElementById("cityInput");
    const suggestionsList = document.getElementById("suggestions");
    const getWeatherBtn = document.getElementById('getWeatherBtn');
    const useLocationBtn = document.getElementById('useLocationBtn');
    const result = document.getElementById("weatherResult");
    const forecast = document.getElementById("forecastResult");

    unitToggle.addEventListener("change", () => {
      unit = unitToggle.value;
      if (cityInput.value.trim()) {
        fetchWeatherByCity(cityInput.value.trim());
      }
    });

    let debounceTimeout;
    cityInput.addEventListener("input", () => {
      const query = cityInput.value.trim();
      clearTimeout(debounceTimeout);
      if (query.length < 2) {
        suggestionsList.style.display = "none";
        return;
      }
      debounceTimeout = setTimeout(() => {
        fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${query}&limit=5&appid=${apiKey}`)
          .then(res => res.json())
          .then(data => {
            suggestionsList.innerHTML = "";
            if (data.length === 0) {
              suggestionsList.style.display = "none";
              return;
            }
            data.forEach(place => {
              const li = document.createElement("li");
              li.textContent = `${place.name}, ${place.country}`;
              li.tabIndex = 0;
              li.onclick = () => {
                cityInput.value = place.name;
                suggestionsList.style.display = "none";
              };
              li.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') {
                  cityInput.value = place.name;
                  suggestionsList.style.display = "none";
                }
              });
              suggestionsList.appendChild(li);
            });
            suggestionsList.style.display = "block";
          });
      }, 300);
    });

    document.addEventListener("click", (e) => {
      if (!cityInput.contains(e.target) && !suggestionsList.contains(e.target)) {
        suggestionsList.style.display = "none";
      }
    });

    getWeatherBtn.onclick = () => {
      const city = cityInput.value.trim();
      if (!city) return;
      fetchWeatherByCity(city);
      document.documentElement.scrollTop = 0;
    };

    useLocationBtn.onclick = () => {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(position => {
        const { latitude, longitude } = position.coords;
        fetchCityFromCoords(latitude, longitude).then(city => {
          fetchWeatherByCoords(latitude, longitude, city);
          document.documentElement.scrollTop = 0;
        });
      });
    };

    function fetchCityFromCoords(lat, lon) {
      return fetch(`https://api.openweathermap.org/geo/1.0/reverse?lat=${lat}&lon=${lon}&limit=1&appid=${apiKey}`)
        .then(res => res.json())
        .then(data => data[0]?.name || "Your Location");
    }

    function fetchWeatherByCity(city) {
      fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=${unit}`)
        .then(res => res.json())
        .then(displayCurrentWeather);
      fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=${unit}`)
        .then(res => res.json())
        .then(displayForecast);
    }

    function fetchWeatherByCoords(lat, lon, cityName = "Your Location") {
      fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=${unit}`)
        .then(res => res.json())
        .then(data => {
          data.name = cityName;
          displayCurrentWeather(data);
        });
      fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${apiKey}&units=${unit}`)
        .then(res => res.json())
        .then(displayForecast);
    }

    function displayCurrentWeather(data) {
      const emoji = getEmoji(data.weather[0].main);
      result.innerHTML = `
        <h2>${data.name}, ${data.sys.country}</h2>
        <img src="https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png" alt="Icon"/>
        <p><strong>${data.main.temp} ${unit === "metric" ? "°C" : "°F"}</strong> ${emoji}</p>
        <p>${data.weather[0].description}</p>
      `;
    }

    function displayForecast(data) {
      const daily = {};
      data.list.forEach(entry => {
        const date = entry.dt_txt.split(" ")[0];
        if (!daily[date] && entry.dt_txt.includes("12:00:00")) {
          daily[date] = entry;
        }
      });
      let forecastHTML = "<h3>5-Day Forecast</h3>";
      Object.values(daily).slice(0, 5).forEach(day => {
        const emoji = getEmoji(day.weather[0].main);
        const date = new Date(day.dt_txt).toDateString();
        forecastHTML += `
          <div class="forecast-day">
            <strong>${date}</strong><br/>
            ${day.main.temp} ${unit === "metric" ? "°C" : "°F"} - ${day.weather[0].description} ${emoji}
          </div>
        `;
      });
      forecast.innerHTML = forecastHTML;
    }

    function getEmoji(condition) {
      switch (condition.toLowerCase()) {
        case 'clear': return '☀️';
        case 'clouds': return '⛅';
        case 'rain': return '🌧️';
        case 'drizzle': return '🌦️';
        case 'thunderstorm': return '⛈️';
        case 'snow': return '❄️';
        case 'mist':
        case 'fog': return '🌫️';
        default: return '🌈';
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }
  </script>
</body>
</html>
