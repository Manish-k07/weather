<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Responsive weather dashboard using Open-Meteo."><title>Weather Dashboard</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#07111f;color:#f8fafc}main{width:min(980px,92%);margin:auto;padding:50px 0}.shell{background:#0e1b2f;border:1px solid #243653;border-radius:24px;padding:28px}header{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:clamp(2rem,5vw,3.2rem);margin:0}p{color:#9fb0c7}.controls{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-top:24px}input,select,button{font:inherit;padding:12px 14px;border:1px solid #243653;border-radius:12px;background:#0a1527;color:#fff}button{background:#38bdf8;color:#03121c;border:0;font-weight:800;cursor:pointer}.secondary{background:#17263e;color:#fff}.status{min-height:24px;margin-top:14px;color:#9fb0c7}.error{color:#fca5a5}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:22px}.card{background:#0a1527;border:1px solid #243653;border-radius:16px;padding:18px}.current{margin-top:22px}.temp{font-size:2.8rem;font-weight:850}.muted{color:#9fb0c7}@media(max-width:650px){.controls{grid-template-columns:1fr}.shell{padding:20px}}</style></head><body><main><section class="shell"><header><div><h1>Weather Dashboard</h1><p>Current conditions and a five-day forecast.</p></div><label>Units <select id="units"><option value="celsius">°C</option><option value="fahrenheit">°F</option></select></label></header><form id="searchForm" class="controls"><input id="city" placeholder="Enter a city" autocomplete="off" required aria-label="City"><button>Search</button><button type="button" class="secondary" id="location">Use my location</button></form><div id="status" class="status" role="status" aria-live="polite"></div><section id="current"></section><section id="forecast" class="cards"></section></section></main><script>
const city=document.querySelector('#city'),statusEl=document.querySelector('#status'),currentEl=document.querySelector('#current'),forecastEl=document.querySelector('#forecast'),units=document.querySelector('#units'),state={lat:null,lon:null,name:'',country:''};
const weatherText={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Rain showers',82:'Heavy rain showers',95:'Thunderstorm',96:'Thunderstorm with hail',99:'Thunderstorm with hail'};
function status(m,e=false){statusEl.textContent=m;statusEl.className='status'+(e?' error':'')}
function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function geocode(n){const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(n)+'&count=1&language=en&format=json');if(!r.ok)throw Error('Location search failed.');const d=await r.json();if(!d.results?.length)throw Error('City not found.');return d.results[0]}
async function load(){status('Loading weather…');const q=new URLSearchParams({latitude:state.lat,longitude:state.lon,current:'temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m',daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',timezone:'auto',forecast_days:'6',temperature_unit:units.value,wind_speed_unit:'kmh'});const r=await fetch('https://api.open-meteo.com/v1/forecast?'+q);if(!r.ok)throw Error('Weather service is unavailable.');const d=await r.json(),u=units.value==='celsius'?'°C':'°F',c=d.current;currentEl.innerHTML='<div class="card current"><div class="muted">'+esc(state.name)+(state.country?', '+esc(state.country):'')+'</div><div class="temp">'+c.temperature_2m+u+'</div><div>'+esc(weatherText[c.weather_code]||'Current conditions')+'</div><div class="muted">Feels like '+c.apparent_temperature+u+' · Humidity '+c.relative_humidity_2m+'% · Wind '+c.wind_speed_10m+' km/h</div></div>';forecastEl.innerHTML=d.daily.time.slice(0,5).map((x,i)=>'<article class="card"><strong>'+new Date(x+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'</strong><p>'+esc(weatherText[d.daily.weather_code[i]]||'Conditions unavailable')+'</p><strong>'+d.daily.temperature_2m_max[i]+u+'</strong> / '+d.daily.temperature_2m_min[i]+u+'<p class="muted">Rain chance '+d.daily.precipitation_probability_max[i]+'%</p></article>').join('');status('Updated just now.')}
document.querySelector('#searchForm').addEventListener('submit',async e=>{e.preventDefault();try{const p=await geocode(city.value.trim());Object.assign(state,{lat:p.latitude,lon:p.longitude,name:p.name,country:p.country});await load()}catch(e){status(e.message,true)}});
document.querySelector('#location').addEventListener('click',()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(async p=>{try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/reverse?latitude='+p.coords.latitude+'&longitude='+p.coords.longitude+'&count=1&language=en&format=json');if(!r.ok)throw Error('Reverse geocoding failed.');const x=(await r.json()).results?.[0]||{};Object.assign(state,{lat:p.coords.latitude,lon:p.coords.longitude,name:x.name||'Your location',country:x.country||''});city.value=state.name;await load()}catch(e){status(e.message,true)}},()=>status('Location permission was denied or unavailable.',true),{timeout:10000}):status('Geolocation is not supported.',true));
units.addEventListener('change',()=>state.lat!==null&&load().catch(e=>status(e.message,true)));
</script></body></html>
