<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Simple weather dashboard with current conditions and a five-day forecast.">
<title>Weather Dashboard</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142033;background:#eef6ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eaf6ff,#dfe8ff)}
main{width:min(900px,92%);margin:0 auto;padding:56px 0}.shell{background:rgba(255,255,255,.9);border:1px solid #dce6f2;border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(40,70,110,.14)}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:clamp(2rem,5vw,3.2rem)}p{color:#5c6878}.controls{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-top:24px}input,select,button{font:inherit;padding:12px 14px;border:1px solid #cdd8e6;border-radius:12px}button{background:#2563eb;color:#fff;border:0;cursor:pointer;font-weight:700}button.secondary{background:#e9eef7;color:#18253a}.status{min-height:24px;margin-top:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:22px}.card{background:#f8fbff;border:1px solid #e0e8f2;border-radius:16px;padding:18px}.current{display:flex;align-items:center;gap:18px}.temp{font-size:2.5rem;font-weight:800}.muted{color:#687588}.error{color:#b42318}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:650px){.controls{grid-template-columns:1fr}.shell{padding:20px}}
</style>
</head>
<body>
<main><section class="shell" aria-labelledby="title">
<header><div><h1 id="title">Weather Dashboard</h1><p>Current conditions and a five-day forecast.</p></div><label>Units <select id="units" aria-label="Temperature units"><option value="celsius">°C</option><option value="fahrenheit">°F</option></select></label></header>
<form id="searchForm" class="controls"><label class="sr-only" for="city">City</label><input id="city" placeholder="Enter a city" autocomplete="off" required><button type="submit">Search</button><button type="button" class="secondary" id="location">Use my location</button></form>
<div id="status" class="status" role="status" aria-live="polite"></div><section id="current" aria-live="polite"></section><section id="forecast" class="cards" aria-live="polite"></section>
</section></main>
<script>
const city=document.querySelector('#city'),statusEl=document.querySelector('#status'),currentEl=document.querySelector('#current'),forecastEl=document.querySelector('#forecast'),units=document.querySelector('#units');
const state={lat:null,lon:null,name:null,country:null};
const weatherText={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Rain showers',82:'Heavy rain showers',95:'Thunderstorm',96:'Thunderstorm with hail',99:'Thunderstorm with hail'};
function setStatus(message,error=false){statusEl.textContent=message;statusEl.className='status'+(error?' error':'')}
function params(){return new URLSearchParams({latitude:state.lat,longitude:state.lon,current:'temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m',daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',timezone:'auto',forecast_days:'6',temperature_unit:units.value,wind_speed_unit:'kmh'});}
async function geocode(name){const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(name)+'&count=1&language=en&format=json');if(!r.ok)throw Error('Location search failed.');const d=await r.json();if(!d.results?.length)throw Error('City not found.');return d.results[0]}
async function loadWeather(){setStatus('Loading weather…');currentEl.innerHTML='';forecastEl.innerHTML='';const r=await fetch('https://api.open-meteo.com/v1/forecast?'+params());if(!r.ok)throw Error('Weather service is unavailable.');const d=await r.json();render(d);setStatus('Updated just now.')}
function render(d){const u=units.value==='celsius'?'°C':'°F';const c=d.current;currentEl.innerHTML='<div class="card current"><div><div class="muted">'+escapeHtml(state.name)+(state.country?', '+escapeHtml(state.country):'')+'</div><div class="temp">'+c.temperature_2m+u+'</div><div>'+weatherText[c.weather_code]||'Current conditions'+'</div><div class="muted">Feels like '+c.apparent_temperature+u+' · Humidity '+c.relative_humidity_2m+'% · Wind '+c.wind_speed_10m+' km/h</div></div></div>';forecastEl.innerHTML=d.daily.time.slice(0,5).map((date,i)=>'<article class="card"><strong>'+new Date(date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'</strong><p>'+weatherText[d.daily.weather_code[i]]+'</p><strong>'+d.daily.temperature_2m_max[i]+u+'</strong> / '+d.daily.temperature_2m_min[i]+u+'<p class="muted">Rain chance '+d.daily.precipitation_probability_max[i]+'%</p></article>').join('')}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelector('#searchForm').addEventListener('submit',async e=>{e.preventDefault();try{const p=await geocode(city.value.trim());Object.assign(state,{lat:p.latitude,lon:p.longitude,name:p.name,country:p.country});await loadWeather()}catch(e){setStatus(e.message,true)}})
document.querySelector('#location').addEventListener('click',()=>{if(!navigator.geolocation){setStatus('Geolocation is not supported by this browser.',true);return}setStatus('Getting your location…');navigator.geolocation.getCurrentPosition(async p=>{try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/reverse?latitude='+p.coords.latitude+'&longitude='+p.coords.longitude+'&count=1&language=en&format=json');const d=await r.json();const x=d.results?.[0]||{};Object.assign(state,{lat:p.coords.latitude,lon:p.coords.longitude,name:x.name||'Your location',country:x.country||''});city.value=state.name;await loadWeather()}catch(e){setStatus(e.message,true)}},()=>setStatus('Location permission was denied or unavailable.',true),{enableHighAccuracy:false,timeout:10000})})
units.addEventListener('change',()=>state.lat!==null&&loadWeather().catch(e=>setStatus(e.message,true)));
</script>
</body>
</html>
